# sam.yml
# Deploys Lambda + EventBridge via AWS SAM
# Uses official SAM Docker image — no install step needed
# samconfig.toml holds all deploy configuration

sam_deploy_job:
  stage: sam-deploy
  extends: .assume_role
  image:
    name: public.ecr.aws/sam/build-python3.10:latest
    entrypoint: [""]
  script:
    - cd lambda
    - sam build
    - sam deploy
  rules:
    - if: '$PIPELINE_TYPE == "sam"'
