AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Dashboard - EC2 and ALB Monitoring with ImportValue'

Resources:
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: Dev-EC2-ALB-Dashboard
      DashboardBody: !Sub 
        - |
          {
            "widgets": [
              {
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/EC2", "CPUUtilization", "InstanceId", "${InstanceId}", { "region":"${AWS::Region}" } ],
                    [ "...", { "stat": "Maximum", "label": "CPU Maximum" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "title": "EC2 CPU Utilization",
                  "period": 300,
                  "dimensions": {
                    "InstanceId": "${InstanceId}"
                  },
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 100
                    }
                  }
                },
                "width": 12,
                "height": 6,
                "x": 0,
                "y": 0
              },
              {
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/EC2", "NetworkIn", "InstanceId", "${InstanceId}", { "region":"${AWS::Region}" } ],
                    [ ".", "NetworkOut", ".", ".", { "region":"${AWS::Region}" } ],
                    [ "...", { "stat": "Sum", "label": "Network" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "title": "EC2 Network Traffic",
                  "period": 300,
                  "dimensions": {
                    "InstanceId": "${InstanceId}"
                  }
                },
                "width": 12,
                "height": 6,
                "x": 12,
                "y": 0
              },     
              {
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/ApplicationELB", "RequestCount", "AvailabilityZone", "${AWS::Region}a", "LoadBalancer", "${LBName}", { "region":"${AWS::Region}" } ],
                    [ "...", { "stat": "Sum", "label": "RequestCount" } ]                 
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "title": "ALB Request Count",
                  "period": 300,
                  "dimensions": {
                    "LoadBalancer": "${LBName}"
                  }
                },
                "width": 12,
                "height": 6,
                "x": 0,
                "y": 12
              },
              {
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/ApplicationELB", "TargetResponseTime", "AvailabilityZone", "${AWS::Region}a", "LoadBalancer", "${LBName}", { "region":"${AWS::Region}" } ],
                    [ "...", { "stat": "p99", "label": "TargetResponseTime" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "title": "ALB Response Time",
                  "period": 300,
                  "dimensions": {
                    "LoadBalancer": "${LBName}"
                  }
                },
                "width": 12,
                "height": 6,
                "x": 12,
                "y": 12
              },
              {
                "type": "metric",
                "properties": {
                  "metrics": [
                    [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "AvailabilityZone", "${AWS::Region}a", "LoadBalancer", "${LBName}", { "region":"${AWS::Region}" } ],
                    [ ".", "HTTPCode_ELB_4XX_Count", ".", ".", ".", ".", { "region":"${AWS::Region}" } ],
                    [ ".", "HTTPCode_Target_2XX_Count", ".", "${AWS::Region}a", ".", ".", { "region":"${AWS::Region}" } ],
                    [ "...", { "stat": "Sum", "label": "HTTPCode_ELB__Count" } ]
                  ],
                  "view": "timeSeries",
                  "stacked": true,
                  "region": "${AWS::Region}",
                  "title": "ALB HTTP Response Codes",
                  "period": 300,
                  "dimensions": {
                    "LoadBalancer": "${LBName}"
                  }
                },
                "width": 12,
                "height": 6,
                "x": 0,
                "y": 18
              } 
            ]
          }
        - InstanceId: !ImportValue dev-instance
          LBName: !ImportValue dev-alb-full-name
          TGName: !ImportValue dev-tg-full-name

Outputs:
  DashboardName:
    Value: !Ref MonitoringDashboard
    Description: CloudWatch Dashboard Name
    
  DashboardURL:
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=Dev-EC2-ALB-Dashboard'
    Description: URL to view the dashboard