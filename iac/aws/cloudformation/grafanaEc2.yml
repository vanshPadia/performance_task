AWSTemplateFormatVersion: "2010-09-09"
Description: Public EC2 instance running Grafana + Prometheus - pulls config from repo

Parameters:
  environment:
    Description: Environment type
    Type: String
    AllowedValues:
      - dev
      - stage
      - prod
    Default: dev

  product:
    Description: Name of the product or part of the project
    Type: String
    Default: impressico

  service:
    Description: Name of the Service
    Type: String
    Default: grafanaEc2

  keyName:
    Description: Name of an existing EC2 KeyPair for SSH access
    Type: String
    ConstraintDescription: Must be the name of an existing EC2 KeyPair.

  repoUrl:
    Description: Public GitLab repo URL
    Type: String
    Default: git.impressicocrm.com/pip-workspace/vansh-pip-workspace.git

  slackWebhookUrl:
    Description: Slack webhook URL for Grafana alerts
    Type: String
    NoEcho: true

  gitlabUsername:
    Description: GitLab username for repo access
    Type: String

  gitlabToken:
    Description: GitLab personal access token or CI token
    Type: String
    NoEcho: true

  grafanaAdminPassword:
    Description: Grafana admin password
    Type: String
    NoEcho: true
    Default: Admin@1234

Mappings:
  envToInstance:
    dev:
      InstanceType: t3.micro
      ImageId: ami-0388e3ada3d9812da
    stage:
      InstanceType: t3.micro
      ImageId: ami-0388e3ada3d9812da
    prod:
      InstanceType: t3.micro
      ImageId: ami-0388e3ada3d9812da

Resources:
  grafanaEc2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !FindInMap [envToInstance, !Ref environment, InstanceType]
      ImageId: !FindInMap [envToInstance, !Ref environment, ImageId]
      SubnetId:
        Fn::ImportValue: !Sub "${environment}-${product}-publicSubnet1"
      IamInstanceProfile:
        Fn::ImportValue: !Sub "${environment}-${product}-ec2-instance-profile"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "${environment}-${product}-grafana-sg"
      KeyName: !Ref keyName
      Tags:
        - Key: Name
          Value: !Sub ${environment}-${product}-grafana
        - Key: role
          Value: monitoring
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            apt update -y
            apt install -y docker.io docker-compose curl

            systemctl start docker
            systemctl enable docker
            usermod -aG docker ubuntu

            echo "===== Cloning repo ====="
            git clone --branch devops --single-branch https://${GitUser}:${GitToken}@${RepoUrl} /home/ubuntu/grafana              
            cd /home/ubuntu/grafana/monitering/

            echo "===== Downloading dashboard 1860 ====="
            mkdir -p /home/ubuntu/grafana/monitering/grafana-config/dashboards
            curl -o /home/ubuntu/grafana/monitering/grafana-config/dashboards/node-exporter-1860.json \
              https://grafana.com/api/dashboards/1860/revisions/latest/download

            echo "===== Writing .env for Grafana ====="
            cat > /home/ubuntu/grafana/monitering/docker/.env << EOF
            GF_SECURITY_ADMIN_PASSWORD=${GrafanaPassword}
            SLACK_WEBHOOK_URL=${SlackUrl}
            EOF

            echo "===== Starting Grafana + Prometheus ====="
            cd /home/ubuntu/grafana/monitering/docker
            docker-compose up -d

          - RepoUrl: !Ref repoUrl
            GrafanaPassword: !Ref grafanaAdminPassword
            SlackUrl: !Ref slackWebhookUrl
            GitUser: !Ref gitlabUsername   
            GitToken: !Ref gitlabToken    

Outputs:
  grafanaInstanceId:
    Description: Grafana EC2 Instance ID
    Value: !Ref grafanaEc2Instance
    Export:
      Name: !Sub "${environment}-${product}-grafana-instance"

  grafanaPublicIp:
    Description: Grafana EC2 Public IP
    Value: !GetAtt grafanaEc2Instance.PublicIp
    Export:
      Name: !Sub "${environment}-${product}-grafana-public-ip"

  grafanaUrl:
    Description: Grafana dashboard URL
    Value: !Sub "http://${grafanaEc2Instance.PublicIp}:3000"
    Export:
      Name: !Sub "${environment}-${product}-grafana-url"
