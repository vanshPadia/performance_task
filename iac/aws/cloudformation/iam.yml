AWSTemplateFormatVersion: "2010-09-09"
Description: IAM roles and policies for EC2 instances (app) and Lambda (termination handler)

Parameters:
  environment:
    Description: Environment type
    Type: String
    AllowedValues:
      - dev
      - stage
      - prod
    Default: dev

  product:
    Description: Name of the product or part of the project
    Type: String
    Default: impressico

  service:
    Description: Name of the Service
    Type: String
    Default: iam

Resources:
  ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${environment}-${product}-ec2-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # SSM access (no SSH needed)
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy # CloudWatch agent
      Policies:
        # Pull images from ECR
        - PolicyName: ECRAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                Resource: "*"
        # Write logs/backups to S3 (used by Lambda SSM backup command on EC2)
        - PolicyName: S3BackupAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${environment}-${product}-backups"
                  - !Sub "arn:aws:s3:::${environment}-${product}-backups/*"

        # Prometheus EC2 service discovery — reads instance tags to find app EC2s
        - PolicyName: PrometheusEC2Discovery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                Resource: "*"

        # Write application logs to CloudWatch
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ec2/${environment}-${product}*"

      Tags:
        - Key: Name
          Value: !Sub ${environment}-${product}-ec2-instance-role

  ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${environment}-${product}-ec2-instance-profile
      Roles:
        - !Ref ec2InstanceRole
  lambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${environment}-${product}-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole # CloudWatch logs for Lambda
      Policies:
        # Send SSM run command to dying EC2 for backup
        - PolicyName: SSMRunCommand
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

        # Complete the ASG lifecycle hook (let termination proceed)
        - PolicyName: ASGLifecycleAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:CompleteLifecycleAction
                  - autoscaling:DescribeAutoScalingInstances
                Resource: "*"
        # Write backup archive to S3
        - PolicyName: LambdaS3BackupAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${environment}-${product}-backups"
                  - !Sub "arn:aws:s3:::${environment}-${product}-backups/*"

      Tags:
        - Key: Name
          Value: !Sub ${environment}-${product}-lambda-execution-role

Outputs:
  ec2InstanceRoleArn:
    Description: ARN of the EC2 Instance Role
    Value: !GetAtt ec2InstanceRole.Arn
    Export:
      Name: !Sub "${environment}-${product}-ec2-instance-role-arn"

  ec2InstanceProfileArn:
    Description: ARN of the EC2 Instance Profile
    Value: !GetAtt ec2InstanceProfile.Arn
    Export:
      Name: !Sub "${environment}-${product}-ec2-instance-profile-arn"

  ec2InstanceProfileName:
    Description: Name of the EC2 Instance Profile
    Value: !Ref ec2InstanceProfile
    Export:
      Name: !Sub "${environment}-${product}-ec2-instance-profile"

  lambdaExecutionRoleArn:
    Description: ARN of the Lambda Execution Role
    Value: !GetAtt lambdaExecutionRole.Arn
    Export:
      Name: !Sub "${environment}-${product}-lambda-execution-role-arn"
