AWSTemplateFormatVersion: "2010-09-09"
Description: SSM Command Document for deploying app containers from ECR to ASG EC2s

Parameters:
  environment:
    Description: Environment type
    Type: String
    AllowedValues:
      - dev
      - stage
      - prod
    Default: dev

  product:
    Description: Name of the product or part of the project
    Type: String
    Default: impressico

  service:
    Description: Name of the Service
    Type: String
    Default: ssm

Resources:
  deployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub ${environment}-${product}-deploy
      DocumentType: Command
      DocumentFormat: YAML
      Content:
        schemaVersion: "2.2"
        description: "Pull new image from ECR and redeploy app using docker compose"
        parameters:
          imageTag:
            type: String
            description: "Git commit SHA image tag to deploy"
            default: "latest"
          application:
            type: String
            description: "Which service to deploy: frontend, backend, or both"
            default: "both"
            allowedValues:
              - frontend
              - backend
              - both
        mainSteps:
          - action: aws:runShellScript
            name: DeployApp
            inputs:
              timeoutSeconds: "300"
              runCommand:
                - "#!/bin/bash"
                - "set -e"
                - ""
                - "IMAGE_TAG='{{ imageTag }}'"
                - "APPLICATION='{{ application }}'"
                - ""
                - "echo '===== [1/5] ECR login ====='"
                - "REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)"
                - "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
                - "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
                - "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}"
                - ""
                - "echo '===== [2/5] Pull new image(s) ====='"
                - 'if [ "${APPLICATION}" = ''backend'' ] || [ "${APPLICATION}" = ''both'' ]; then'
                - '  echo "Pulling backend:${IMAGE_TAG}"'
                - "  docker pull ${ECR_REGISTRY}/{{ ssm:/aws/service/global-infrastructure/current-region }}-impressico-backend:${IMAGE_TAG} || \\"
                - "  docker pull ${ECR_REGISTRY}/dev-impressico-backend:${IMAGE_TAG}"
                - "fi"
                - 'if [ "${APPLICATION}" = ''frontend'' ] || [ "${APPLICATION}" = ''both'' ]; then'
                - '  echo "Pulling frontend:${IMAGE_TAG}"'
                - "  docker pull ${ECR_REGISTRY}/dev-impressico-frontend:${IMAGE_TAG} || true"
                - "fi"
                - ""
                - "echo '===== [3/5] Update .env.prod with new IMAGE_TAG ====='"
                - "cd /home/ubuntu/applications/imple-fullstack-app"
                - "# Update or write the env file"
                - "cat > .env.prod << EOF"
                - "ECR_REGISTRY=${ECR_REGISTRY}"
                - "ENVIRONMENT=dev"
                - "PRODUCT=impressico"
                - "IMAGE_TAG=${IMAGE_TAG}"
                - "ALB_DNS=$(aws elbv2 describe-load-balancers --query 'LoadBalancers[?contains(LoadBalancerName, `dev-impressico-alb`)].DNSName' --output text --region ${REGION})"
                - "EOF"
                - ""
                - "echo '===== [4/5] Redeploy with new image ====='"
                - 'if [ "${APPLICATION}" = ''both'' ]; then'
                - "  docker compose up -d --no-build"
                - "else"
                - "  docker compose up -d --no-build ${APPLICATION}"
                - "fi"
                - ""
                - "echo '===== [5/5] Verify containers running ====='"
                - "sleep 5"
                - "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
                - ""
                - "echo 'Deployment complete. Image tag: '${IMAGE_TAG}"

Outputs:
  deployDocumentName:
    Description: SSM Deploy Document Name
    Value: !Ref deployDocument
    Export:
      Name: !Sub "${environment}-${product}-deploy-document"
