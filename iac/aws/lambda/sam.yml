AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM template - Lambda termination handler + EventBridge rule in one file

Parameters:
  environment:
    Description: Environment type
    Type: String
    AllowedValues:
      - dev
      - stage
      - prod
    Default: dev

  product:
    Description: Name of the product or part of the project
    Type: String
    Default: impressico

Resources:
  terminationHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${environment}-${product}-termination-handler"
      CodeUri: ./python/
      Handler: lambda.lambda_handler
      Runtime: python3.10
      MemorySize: 128
      Timeout: 300
      Role:
        Fn::ImportValue: !Sub "${environment}-${product}-lambda-execution-role-arn"
      Environment:
        Variables:
          ENVIRONMENT: !Ref environment
          PRODUCT: !Ref product
          S3_BUCKET_NAME: !Sub "${environment}-${product}-backups"
          SSM_PARAM_SLACK: !Sub "/${environment}/slack/webhook"
      Tags:
        environment: !Ref environment
        product: !Ref product

  lambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref terminationHandlerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt asgTerminationRule.Arn

  asgTerminationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${environment}-${product}-asg-termination-rule"
      Description: "Trigger Lambda when ASG instance enters TERMINATING:Wait state"
      State: ENABLED
      EventPattern:
        source:
          - "aws.autoscaling"
        detail-type:
          - "EC2 Instance-terminate Lifecycle Action"
        detail:
          AutoScalingGroupName:
            - !Sub "${environment}-${product}-asg"
          LifecycleHookName:
            - !Sub "${environment}-${product}-termination-hook"
      Targets:
        - Id: "TerminationHandlerLambda"
          Arn: !GetAtt terminationHandlerFunction.Arn

  lambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${environment}-${product}-termination-handler"
      RetentionInDays: 14

Outputs:
  lambdaFunctionName:
    Description: Lambda function name
    Value: !Ref terminationHandlerFunction
    Export:
      Name: !Sub "${environment}-${product}-termination-lambda"

  lambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt terminationHandlerFunction.Arn
    Export:
      Name: !Sub "${environment}-${product}-termination-lambda-arn"

  eventBridgeRuleArn:
    Description: EventBridge rule ARN
    Value: !GetAtt asgTerminationRule.Arn
    Export:
      Name: !Sub "${environment}-${product}-termination-rule-arn"
