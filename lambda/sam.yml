AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Lambda function with VPC configuration and OpenSearch integration

Parameters:
  environment:
    Description: Environment type
    Type: String
    AllowedValues:
      - dev
      - prod
      - staging

  indexPattern:
    Type: String
    Default: "filebeat02-*"
    Description: Index pattern for OpenSearch

Resources:
  lambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for lambda access
      VpcId: !ImportValue vpc
      SecurityGroupEgress:
        - IpProtocol: -1  
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0  
      Tags:
        - Key: Name
          Value: !Sub ${environment}-lambdaSecurityGroup

  lambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${environment}-lambda"
      CodeUri: ./python/
      Handler: lambda.lambda_handler
      Runtime: python3.10
      Description: Lambda function for log management with OpenSearch
      MemorySize: 128
      Timeout: 300
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          INDEX_PATTERN: !Ref indexPattern
          OPENSEARCH_ENDPOINT: !ImportValue DomainEndpoint
      VpcConfig:
        SecurityGroupIds:
          - !Ref lambdaSecurityGroup
        SubnetIds:
          - !ImportValue publicSubnet1
          - !ImportValue publicSubnet2
      Role: !GetAtt lambdaRole.Arn
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 6 * * ? *)
            Description: Schedule for Lambda function
            Enabled: true

  lambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: !Sub "${environment}-lambda-logs"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${environment}-lambda:*"
        - PolicyName: !Sub "${environment}-lambda-network"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${environment}-lambda:*"

Outputs:
  lambdaFunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt lambdaFunction.Arn

  securityGroupId:
    Description: ID of the Lambda security group
    Value: !Ref lambdaSecurityGroup
