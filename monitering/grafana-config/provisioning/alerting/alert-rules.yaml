apiVersion: 1
groups:
  - orgId: 1
    name: ec2-cpu-alerts
    folder: cpu
    interval: 1m
    rules:
      - uid: ec2-cpu-high
        title: EC2 High CPU
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              expr: 100 - (avg by(instance_id) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              type: threshold
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 2m
        isPaused: false
        annotations:
          summary: "EC2 CPU above 80% for 2 minutes on {{ $labels.instance_id }}"
        notification_settings:
          receiver: slack
