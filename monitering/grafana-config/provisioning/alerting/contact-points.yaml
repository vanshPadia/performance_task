apiVersion: 1
contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-contact
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL} # read from .env file
          title: "Grafana Alert"
          text: "{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
        disableResolveMessage: false
