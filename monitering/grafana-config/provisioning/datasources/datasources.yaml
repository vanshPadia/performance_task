apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-ds
    access: proxy
    url: http://prometheus:9090 # prometheus container name in docker-compose
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch-ds
    access: proxy
    jsonData:
      authType: default
      defaultRegion: ap-south-1
