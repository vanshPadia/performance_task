version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-testdb}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD:-password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    context: ./backend
    container_name: node_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-testdb}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    context: ./frontend
    container_name: react_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://${ALB_DNS:-localhost}:5000/api
    depends_on:
      - backend

volumes:
  mysql_data:
